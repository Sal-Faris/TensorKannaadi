[package]
name = "kannaadi"
version = "0.2.0"
description = "Desktop shell for the Kannaadi research workbench"
authors = ["Sal-Faris"]
edition = "2021"

[lib]
name = "kannaadi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
